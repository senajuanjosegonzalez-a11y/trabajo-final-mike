server {
    listen       80;
    server_name  localhost;
    root   /usr/share/nginx/html;
    index  index.html;

    # SPA: cualquier ruta que no sea un archivo existente cae a index.html
    # (necesario para el router de Angular: /login, /catalog, /wishlist, etc.)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
