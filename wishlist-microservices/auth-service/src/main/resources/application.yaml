spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:auth_db}
    driverClassName: com.mysql.cj.jdbc.Driver
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    defer-datasource-initialization: true
  sql:
    init:
      mode: always

server:
  port: ${SERVER_PORT:8081}
  servlet:
    context-path: /api/v1

security:
  jwt:
    # Debe ser EXACTAMENTE la misma llave en auth-service, product-service y
    # wishlist-service para que estos puedan validar el token de forma
    # independiente. Generar con: openssl rand -base64 32
    secret-key: ${JWT_SECRET_KEY}
    token-expiration: ${JWT_EXPIRATION} # 1 hora en ms
