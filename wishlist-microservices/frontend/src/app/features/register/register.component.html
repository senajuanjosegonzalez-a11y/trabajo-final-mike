<section class="auth-page">
  <div class="auth-card card">
    <div class="auth-mark">C</div>
    <h1>Crea tu cuenta</h1>
    <p>Regístrate para armar tu lista de deseos</p>

    @if (errorMessage()) {
      <div class="alert alert-error">{{ errorMessage() }}</div>
    }
    @if (successMessage()) {
      <div class="alert alert-success">{{ successMessage() }}</div>
    }

    <form (ngSubmit)="submit()" #registerForm="ngForm">
      <div class="field">
        <label for="username">Usuario</label>
        <input id="username" name="username" type="text" [(ngModel)]="username" placeholder="ana.gomez" />
      </div>
      <div class="field">
        <label for="email">Correo</label>
        <input id="email" name="email" type="email" [(ngModel)]="email" placeholder="ana@correo.com" />
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" [(ngModel)]="password" placeholder="••••••••" />
      </div>
      <div class="field">
        <label for="rolId">Tipo de cuenta</label>
        <select id="rolId" name="rolId" [(ngModel)]="rolId">
          <option [value]="1">Cliente</option>
          <option [value]="2">Administrador</option>
        </select>
      </div>

      <button type="submit" class="btn btn-primary btn-block" [disabled]="loading()">
        {{ loading() ? 'Creando cuenta...' : 'Crear cuenta' }}
      </button>
    </form>

    <p class="switch-link">¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>
  </div>
</section>
